<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<title>Домашний бар</title>
<link rel="stylesheet" href="css/app.css?v=20260905145140">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍸</text></svg>">
</head>
<body>

<div id="lock" class="lock">
  <form id="lock-form" class="lock-card">
    <div class="lock-mark">🍸</div>
    <h1>Домашний бар</h1>
    <input id="passphrase" type="password" autocomplete="current-password" placeholder="Парольная фраза" required>
    <button type="submit">Войти</button>
    <p id="lock-error" class="lock-error" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <h1 id="title">Бар</h1>
      <span id="sync" class="sync" title="Состояние синхронизации"></span>
    </div>
    <input id="search" type="search" placeholder="Поиск" autocomplete="off">
    <div id="filters" class="filters"></div>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <a href="#/bar"       data-tab="bar">🍾<span>Бар</span></a>
    <a href="#/cocktails" data-tab="cocktails">🍸<span>Коктейли</span></a>
    <a href="#/places"    data-tab="places">📍<span>Места</span></a>
    <a href="#/dishes"    data-tab="dishes">🍽<span>Блюда</span></a>
  </nav>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-body" id="sheet-body"></div></div>

<script type="module" src="js/app.js?v=20260905145140"></script>
</body>
</html>
